<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Minis 报告发布</title>
<style>
  :root{--bg:#0b0d14;--card:#131722;--text:#e8eaf0;--muted:#9aa3b5;--line:rgba(255,255,255,.08);--accent:#25c25e;--safe-top:env(safe-area-inset-top,0)}
  *{box-sizing:border-box;margin:0;padding:0}
  html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
  body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue","PingFang SC","Hiragino Sans GB","Microsoft YaHei","Source Han Sans SC","STHeiti",sans-serif;font-size:16px;line-height:1.6;overflow-x:hidden;-webkit-font-smoothing:antialiased}
  .wrap{max-width:680px;margin:0 auto;padding:calc(var(--safe-top) + 40px) 20px 80px}
  .brand{text-align:center;margin-bottom:48px}
  .brand .tag{display:inline-block;padding:5px 14px;border:1px solid var(--accent);color:var(--accent);border-radius:999px;font-size:12px;letter-spacing:2px;margin-bottom:18px}
  .brand h1{font-size:clamp(26px,6vw,30px);font-weight:800;letter-spacing:-0.02em}
  .brand p{color:var(--muted);font-size:14px;margin-top:10px}
  .card{display:block;text-decoration:none;color:var(--text);margin:14px 0;border-radius:16px;border:1px solid var(--line);background:var(--card);transition:all .2s;-webkit-tap-highlight-color:transparent}
  .card:active{opacity:.7}
  .card:hover{border-color:var(--accent);transform:translateY(-2px)}
  .card-body{display:flex;align-items:center;gap:16px;padding:20px 22px}
  .arrow{font-size:20px;color:var(--accent);flex-shrink:0}
  .info .t{font-size:17px;font-weight:600;letter-spacing:-0.01em}
  .info .date{font-size:12px;color:var(--muted)}
  footer{margin-top:56px;text-align:center;color:var(--muted);font-size:12px;letter-spacing:0.02em}
  @media(max-width:480px){.wrap{padding:24px 16px 64px}.brand{margin-bottom:36px}.card-body{padding:16px 18px}.info .t{font-size:16px}}
</style>
</head>
<body>
<div class="wrap">
  <div class="brand">
    <div class="tag">MINIS · REPORT ARCHIVE</div>
    <h1>研究报告</h1>
    <p>blog.aii.st</p>
  </div>
  <a class="card" href="https://blog.aii.st/dgx-spark-deepseek-v4-flash/">
  <div class="card-body">
    <span class="arrow">→</span>
    <div class="info">
      <div class="t">Minis 报告发布</div>
      <span class="date">2026-08-23</span>
    </div>
  </div>
</a>
<a class="card" href="https://blog.aii.st/qwen38-27b-uncensored/">
  <div class="card-body">
    <span class="arrow">→</span>
    <div class="info">
      <div class="t">Qwen3.8-27B-Uncensored（HauhauCS-Aggressive · Q6_K_P）参数与性能报告</div>
      <span class="date">2026-08-23</span>
    </div>
  </div>
</a>
<a class="card" href="https://blog.aii.st/xiaowei/">
  <div class="card-body">
    <span class="arrow">→</span>
    <div class="info">
      <div class="t">为什么小微（微信AI）会员付费是微信未来商业化的重要节点</div>
      <span class="date">2026-08-23</span>
    </div>
  </div>
</a>

  <footer>Minis 报告发布</footer>
</div></body></html>
